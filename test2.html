<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#f5f8f6" />
  <title>NORMEX</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --ink: #18372e;
      --green: #1b9a75;
      --green-2: #3caa7c;
      --mint: #d5f1e2;
      --muted: #71867d;
      --faint: #9aa9a2;
      --line: #dceee3;
      --bg: #f5f8f6;
      --bg-grad-a: #ffffff;
      --bg-grad-b: #f8fbf9;
      --bg-grad-c: #f0f5f2;
      --card: #ffffffb8;
      --card-solid: #ffffff;
      --glow-a: #cdeeda;
      --glow-b: #d8eee2;
      --shadow: 0 10px 30px #264d3a0d;
      --scan-fill: #f9fdfb;
      --tile: #e9faf0;
      --tile-2: #d5f1e2;
    }
    [data-theme="dark"] {
      --ink: #e6f4ec;
      --green: #3fc695;
      --green-2: #4fd3a3;
      --mint: #164a3a;
      --muted: #9db8ab;
      --faint: #6f8a7d;
      --line: #214237;
      --bg: #0d1a15;
      --bg-grad-a: #142620;
      --bg-grad-b: #101f19;
      --bg-grad-c: #0c1813;
      --card: #142620c8;
      --card-solid: #142620;
      --glow-a: #1b5a44;
      --glow-b: #16503c;
      --shadow: 0 10px 30px #00000055;
      --scan-fill: #112019;
      --tile: #1a3a2e;
      --tile-2: #163429;
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--ink);
      font-family: "Manrope", system-ui, -apple-system, sans-serif;
      -webkit-font-smoothing: antialiased;
      transition: background .35s ease, color .35s ease;
    }

    .app-shell {
      min-height: 100vh;
      min-height: 100svh;
      position: relative;
      overflow: hidden;
      display: grid;
      grid-template-rows: auto 1fr;
      background: radial-gradient(ellipse at 50% 46%, var(--bg-grad-a) 0, var(--bg-grad-b) 45%, var(--bg-grad-c) 100%);
      transition: background .35s ease;
    }
    .app-shell::before, .app-shell::after {
      content: ""; position: absolute; width: 320px; height: 320px; border-radius: 50%;
      filter: blur(75px); opacity: .28; pointer-events: none;
    }
    .app-shell::before { left: -190px; top: 22%; background: var(--glow-a); }
    .app-shell::after { right: -190px; bottom: 0; background: var(--glow-b); }

    /* ---------- Top bar ---------- */
    .topbar {
      position: relative; z-index: 3;
      display: flex; align-items: center; justify-content: space-between;
      padding: 18px 28px;
    }
    .brand { display: flex; align-items: center; gap: 12px; text-decoration: none; color: inherit; }
    .brand-name { font-weight: 800; font-size: 20px; letter-spacing: -1px; color: var(--ink); }

    .nav {
      display: flex; align-items: center; gap: 4px;
      padding: 5px; border-radius: 999px;
      border: 1px solid var(--line); background: var(--card);
      backdrop-filter: blur(9px); box-shadow: var(--shadow);
    }
    .nav button {
      border: 0; background: transparent; cursor: pointer;
      font: 600 12.5px/1 "Manrope", sans-serif; letter-spacing: -.1px;
      color: var(--muted); padding: 9px 15px; border-radius: 999px;
      display: inline-flex; align-items: center; gap: 7px;
      transition: background .2s, color .2s;
    }
    .nav button svg { width: 14px; height: 14px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .nav button:hover { color: var(--ink); }
    .nav button.active { background: var(--green); color: #fff; box-shadow: 0 6px 16px #1b9a7540; }

    /* ---------- Mini logo (same mark as slide 1, scaled) ---------- */
    .brand-mark {
      width: 104px; height: 104px; position: relative; display: grid; place-items: center;
      transform: scale(.42); transform-origin: center; margin: -30px;
    }
    .brand-mark::before {
      content: ""; position: absolute; inset: 12px; border-radius: 32px;
      background: linear-gradient(145deg, var(--tile), var(--tile-2));
      box-shadow: 0 10px 28px #4b9c771c, inset 0 1px 0 #ffffff40; transform: rotate(-7deg);
    }
    .lens {
      position: relative; z-index: 1; width: 47px; height: 47px; border: 1.5px solid #48ac82; border-radius: 50%;
      display: grid; place-items: center;
      background: radial-gradient(circle, var(--card-solid) 0 52%, var(--tile) 54% 100%);
      box-shadow: 0 0 0 5px #ffffff30, 0 0 24px #52bb8b30;
    }
    .lens::before, .lens::after { content: ""; position: absolute; border: 1px solid #a1d9b8; border-radius: 50%; }
    .lens::before { inset: -5px; }
    .lens::after { inset: 7px; border-color: #c4e8d180; }
    .iris {
      width: 17px; height: 17px; border-radius: 50%; background: linear-gradient(145deg, #39aa7c, #117b61);
      display: grid; place-items: center; box-shadow: 0 0 12px #3cbd8a88; animation: iris-breathe 3s ease-in-out infinite;
    }
    .iris i { width: 6px; height: 6px; background: #eafff3; border-radius: 50%; box-shadow: 0 0 6px #fff; }
    .orbit { position: absolute; border: 1px solid #83cda7; border-radius: 50%; z-index: 1; opacity: .7; }
    .orbit-one { width: 78px; height: 78px; border-style: dashed; animation: orbit 18s linear infinite; }
    .orbit-two { width: 94px; height: 94px; border-color: #b4dfc7; animation: orbit 24s linear infinite reverse; }
    .focus { position: absolute; z-index: 2; width: 8px; height: 8px; border-color: #3caa7c; border-style: solid; opacity: .9; }
    .focus-a { left: 19px; top: 20px; border-width: 1.5px 0 0 1.5px; }
    .focus-b { right: 19px; top: 20px; border-width: 1.5px 1.5px 0 0; }
    .focus-c { left: 19px; bottom: 20px; border-width: 0 0 1.5px 1.5px; }
    .focus-d { right: 19px; bottom: 20px; border-width: 0 1.5px 1.5px 0; }
    .spark { position: absolute; width: 6px; height: 6px; background: #4bb889; border-radius: 2px; z-index: 2; }
    .spark-a { right: 4px; top: 15px; animation: twinkle 2.2s ease-in-out infinite; }
    .spark-b { left: 7px; bottom: 13px; width: 4px; height: 4px; background: #a7dcbc; animation: twinkle 2.8s .4s ease-in-out infinite; }

    /* ---------- Center stage ---------- */
    .stage {
      position: relative; z-index: 1;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      text-align: center; padding: 10px 20px 110px;
    }
    .eyebrow {
      font-size: 10px; font-weight: 700; letter-spacing: 2px; color: var(--green);
      margin: 0 0 14px; animation: fade-up .7s .1s both;
    }
    .eyebrow::before, .eyebrow::after { content: "✦"; margin: 0 8px; opacity: .8; }

    .scanner {
      position: relative; width: min(560px, 90vw); aspect-ratio: 16 / 10;
      border-radius: 28px; cursor: pointer;
      border: 1.5px dashed #7ccba5; background: var(--scan-fill);
      box-shadow: 0 0 0 10px var(--card), 0 30px 60px #264d3a12, 0 0 60px #52bb8b22;
      display: grid; place-items: center; overflow: hidden;
      animation: mark-arrive 1s cubic-bezier(.2,.8,.2,1) both;
      transition: border-color .25s, transform .25s, box-shadow .25s;
    }
    .scanner:hover, .scanner.drag { border-color: var(--green); transform: translateY(-2px); box-shadow: 0 0 0 10px var(--card), 0 34px 70px #264d3a18, 0 0 80px #52bb8b36; }
    .scanner .grid {
      position: absolute; inset: 0; opacity: .5; pointer-events: none;
      background-image: linear-gradient(var(--line) 1px, transparent 1px), linear-gradient(90deg, var(--line) 1px, transparent 1px);
      background-size: 36px 36px;
      mask-image: radial-gradient(ellipse at center, #000 30%, transparent 75%);
      -webkit-mask-image: radial-gradient(ellipse at center, #000 30%, transparent 75%);
    }
    .scanner .corner { position: absolute; width: 26px; height: 26px; border: 2.5px solid var(--green-2); z-index: 2; }
    .corner.tl { left: 18px; top: 18px; border-right: 0; border-bottom: 0; border-radius: 8px 0 0 0; }
    .corner.tr { right: 18px; top: 18px; border-left: 0; border-bottom: 0; border-radius: 0 8px 0 0; }
    .corner.bl { left: 18px; bottom: 18px; border-right: 0; border-top: 0; border-radius: 0 0 0 8px; }
    .corner.br { right: 18px; bottom: 18px; border-left: 0; border-top: 0; border-radius: 0 0 8px 0; }
    .beam {
      position: absolute; left: 6%; right: 6%; height: 2px; top: 0; z-index: 2;
      background: linear-gradient(90deg, transparent, var(--green) 20%, var(--green) 80%, transparent);
      box-shadow: 0 0 18px 4px #3cbd8a66; animation: beam 4.5s ease-in-out infinite;
    }
    .beam::after {
      content: ""; position: absolute; left: 0; right: 0; top: 0; height: 70px;
      background: linear-gradient(180deg, #3cbd8a2e, transparent);
    }
    .scan-inner { position: relative; z-index: 3; display: flex; flex-direction: column; align-items: center; gap: 10px; }
    .scan-icon {
      width: 74px; height: 74px; border-radius: 22px;
      background: linear-gradient(145deg, var(--tile), var(--tile-2));
      display: grid; place-items: center; box-shadow: 0 10px 28px #4b9c7722, inset 0 1px 0 #ffffff50;
      transform: rotate(-6deg);
    }
    .scan-icon svg { width: 34px; height: 34px; stroke: var(--green); fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; transform: rotate(6deg); }
    .scan-title { margin: 8px 0 0; font-weight: 800; font-size: clamp(20px, 3vw, 28px); letter-spacing: -1.2px; color: var(--ink); }
    .scan-sub { margin: 0; font-size: 14px; font-weight: 500; color: var(--muted); }
    .scan-sub b { color: var(--green); font-weight: 700; }
    .scan-formats { margin: 4px 0 0; font-size: 11px; color: var(--faint); letter-spacing: .4px; }
    .scanner input { display: none; }
    .scanner img.preview { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: 1; display: none; }
    .scanner.has-image img.preview { display: block; }
    .scanner.has-image .scan-inner, .scanner.has-image .grid { display: none; }

    .actions { display: flex; gap: 10px; margin-top: 26px; animation: fade-up .7s .35s both; flex-wrap: wrap; justify-content: center; }
    .btn {
      border: 1px solid var(--line); background: var(--card); color: var(--ink); cursor: pointer;
      font: 700 13px/1 "Manrope", sans-serif; padding: 13px 22px; border-radius: 999px;
      display: inline-flex; align-items: center; gap: 8px; backdrop-filter: blur(9px);
      box-shadow: var(--shadow); transition: transform .2s, box-shadow .2s;
    }
    .btn svg { width: 15px; height: 15px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .btn:hover { transform: translateY(-2px); }
    .btn.primary { background: linear-gradient(145deg, #2fae82, #117b61); color: #fff; border-color: transparent; box-shadow: 0 10px 26px #1b9a7555; }

    .hint { margin: 22px 0 0; font-size: 12px; color: var(--faint); animation: fade-up .7s .45s both; }

    /* ---------- Theme toggle (bottom right) ---------- */
    .theme-toggle {
      position: absolute; z-index: 4; right: 26px; bottom: 26px;
      display: flex; align-items: center; gap: 4px; padding: 5px;
      border: 1px solid var(--line); border-radius: 999px; background: var(--card);
      backdrop-filter: blur(9px); box-shadow: 0 0 25px #7ccba52b, var(--shadow);
      animation: note-pop .85s .6s both;
    }
    .theme-toggle button {
      border: 0; background: transparent; cursor: pointer; color: var(--muted);
      width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center;
      transition: background .2s, color .2s;
    }
    .theme-toggle button svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
    .theme-toggle button.active { background: var(--green); color: #fff; box-shadow: 0 6px 14px #1b9a7545; }
    .theme-label { font-size: 10px; font-weight: 700; letter-spacing: 1.4px; color: var(--muted); padding: 0 10px 0 8px; }

    /* ---------- Status pill (bottom left) ---------- */
    .status {
      position: absolute; z-index: 4; left: 26px; bottom: 32px;
      display: flex; align-items: center; gap: 8px; font-size: 10px; font-weight: 700; letter-spacing: 1.4px; color: var(--muted);
      animation: note-pop .85s .7s both;
    }
    .status i { width: 7px; height: 7px; border-radius: 50%; background: var(--green); box-shadow: 0 0 10px var(--green); animation: twinkle 2.2s ease-in-out infinite; }

    @keyframes orbit { to { transform: rotate(360deg); } }
    @keyframes twinkle { 0%,100% { transform: scale(.75); opacity: .4; } 50% { transform: scale(1.3); opacity: 1; } }
    @keyframes iris-breathe { 0%,100% { box-shadow: 0 0 8px #3cbd8a55; transform: scale(.96); } 50% { box-shadow: 0 0 16px #3cbd8aaa; transform: scale(1.08); } }
    @keyframes beam { 0% { top: 4%; opacity: 0; } 8% { opacity: 1; } 92% { opacity: 1; } 100% { top: 96%; opacity: 0; } }
    @keyframes note-pop { from { opacity: 0; transform: translateY(12px) scale(.94); filter: blur(4px); } to { opacity: 1; transform: none; filter: blur(0); } }
    @keyframes mark-arrive { from { opacity: 0; transform: translateY(14px) scale(.9); } to { opacity: 1; transform: none; } }
    @keyframes fade-up { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

    @media (max-width: 720px) {
      .topbar { padding: 14px 16px; }
      .nav button span { display: none; }
      .nav button { padding: 10px 12px; }
      .status { display: none; }
      .theme-toggle { right: 16px; bottom: 16px; }
      .theme-label { display: none; }
      .stage { padding-bottom: 90px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; }
    }

    /* First interface: original NORMEX welcome screen */
    #scanApp[hidden], #welcome[hidden] { display: none; }
    .welcome {
      --tile: #e9faf0;
      --tile-2: #d5f1e2;
      --card-solid: #fbfffc;
      position: relative; min-height: 100vh; min-height: 100svh;
      display: grid; place-items: center; overflow: hidden;
      background: radial-gradient(ellipse at 50% 48%, #fff 0, #f8fbf9 43%, #f1f6f3 100%);
      color: #18372e;
    }
    .welcome::before, .welcome::after {
      content: ""; position: absolute; width: 290px; height: 290px;
      border-radius: 50%; filter: blur(70px); opacity: .22; pointer-events: none;
    }
    .welcome::before { left: -180px; top: 24%; background: #cfeddb; }
    .welcome::after { right: -180px; bottom: 2%; background: #d9eee3; }
    .welcome-center {
      position: relative; z-index: 1; display: flex; flex-direction: column;
      align-items: center; text-align: center; padding: 32px 20px;
    }
    .welcome .brand-mark {
      margin: 0; transform: none; animation: welcome-mark 1s cubic-bezier(.2,.8,.2,1) both;
    }
    .welcome .brand-mark::before {
      background: linear-gradient(145deg, #e9faf0, #d5f1e2);
      box-shadow: 0 10px 28px #4b9c771c, inset 0 1px 0 #fff;
    }
    .welcome .lens {
      background: radial-gradient(circle, #fbfffc 0 52%, #e6f7ed 54% 100%);
      box-shadow: 0 0 0 5px #ffffffa8, 0 0 24px #52bb8b30;
    }
    .welcome .lens::after { border-color: #c4e8d1; }
    .welcome h1 {
      margin: 20px 0 0; font: 800 clamp(36px, 7vw, 54px)/1.12 "Manrope", sans-serif;
      letter-spacing: -2.8px; color: #18372e; animation: welcome-type .9s .12s both;
    }
    .welcome-center p {
      margin: 12px 0 0; font: 500 clamp(14px, 2vw, 17px)/1.5 "Manrope", sans-serif;
      letter-spacing: -.25px; color: #71867d; animation: fade-up .7s .3s both;
    }
    .welcome-center .detail-tagline {
      margin-top: 7px; font-size: clamp(12px, 1.7vw, 14px); font-weight: 400;
      color: #9aa9a2; animation: fade-up .7s .43s both;
    }
    .welcome-note {
      position: absolute; z-index: 2; left: 50%; bottom: 27px; transform: translateX(-50%);
      display: flex; align-items: center; justify-content: center; gap: 10px;
      padding: 11px 17px; border: 1px solid #dceee3; border-radius: 999px;
      background: #ffffffa8; box-shadow: 0 0 25px #7ccba52b, 0 5px 20px #264d3a0a;
      backdrop-filter: blur(9px); white-space: nowrap; font-size: 9px; font-weight: 700;
      letter-spacing: 1.5px; color: #789287; animation: welcome-note-pop .85s .65s both;
    }
    .note-spark { font-size: 12px; color: #54b989; text-shadow: 0 0 10px #62c493; animation: twinkle 2.2s ease-in-out infinite; }
    .note-spark:last-child { animation-delay: .8s; }
    @keyframes welcome-mark { from { opacity: 0; transform: translateY(14px) scale(.82); } to { opacity: 1; transform: translateY(0) scale(1); } }
    @keyframes welcome-type { from { opacity: 0; transform: translateY(9px); letter-spacing: -1px; } to { opacity: 1; transform: translateY(0); letter-spacing: -2.8px; } }
    @keyframes welcome-note-pop { from { opacity: 0; transform: translate(-50%, 12px) scale(.94); filter: blur(4px); } to { opacity: 1; transform: translate(-50%, 0) scale(1); filter: blur(0); } }
    @media (max-width: 480px) {
      .welcome-center { padding-bottom: 75px; }
      .welcome h1 { letter-spacing: -2.2px; }
      .welcome-note { bottom: 20px; font-size: 8px; letter-spacing: 1.1px; padding: 10px 13px; gap: 8px; }
    }
  </style>
</head>
<body>
  <!-- First interface, shown for 5.5 seconds -->
  <section class="welcome" id="welcome" aria-label="Welcome to NORMEX">
    <div class="welcome-center">
      <div class="brand-mark" aria-hidden="true">
        <div class="orbit orbit-one"></div><div class="orbit orbit-two"></div>
        <div class="lens"><div class="iris"><i></i></div></div>
        <span class="focus focus-a"></span><span class="focus focus-b"></span>
        <span class="focus focus-c"></span><span class="focus focus-d"></span>
        <div class="spark spark-a"></div><div class="spark spark-b"></div>
      </div>
      <h1>NORMEX</h1>
      <p class="main-tagline">A clearer view of every part.</p>
      <p class="detail-tagline">Inspect an image. See what's good, and what needs a closer look.</p>
    </div>
    <div class="welcome-note"><span class="note-spark">✦</span> BUILT TO HELP YOU SEE THE DIFFERENCE <span class="note-spark">✦</span></div>
  </section>

  <!-- Second interface -->
  <main class="app-shell" id="scanApp" hidden>
    <!-- Top bar -->
    <header class="topbar">
      <a class="brand" href="#" aria-label="NORMEX home">
        <div class="brand-mark" aria-hidden="true">
          <div class="orbit orbit-one"></div><div class="orbit orbit-two"></div>
          <div class="lens"><div class="iris"><i></i></div></div>
          <span class="focus focus-a"></span><span class="focus focus-b"></span>
          <span class="focus focus-c"></span><span class="focus focus-d"></span>
          <div class="spark spark-a"></div><div class="spark spark-b"></div>
        </div>
        <span class="brand-name">NORMEX</span>
      </a>

      <nav class="nav" aria-label="Sections">
        <button class="active" data-tab="scan">
          <svg viewBox="0 0 24 24"><path d="M3 8V5a2 2 0 0 1 2-2h3M16 3h3a2 2 0 0 1 2 2v3M21 16v3a2 2 0 0 1-2 2h-3M8 21H5a2 2 0 0 1-2-2v-3M3 12h18"/></svg>
          <span>Scan</span>
        </button>
        <button data-tab="dashboard">
          <svg viewBox="0 0 24 24"><rect x="3" y="3" width="8" height="8" rx="2"/><rect x="13" y="3" width="8" height="5" rx="2"/><rect x="13" y="11" width="8" height="10" rx="2"/><rect x="3" y="14" width="8" height="7" rx="2"/></svg>
          <span>Dashboard</span>
        </button>
        <button data-tab="analytics">
          <svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>
          <span>Analytics</span>
        </button>
        <button data-tab="history">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
          <span>History</span>
        </button>
      </nav>
    </header>

    <!-- Center stage -->
    <section class="stage" aria-label="Scan an image">
      <p class="eyebrow">INSPECTION MODE</p>

      <label class="scanner" id="scanner" for="file">
        <div class="grid"></div>
        <span class="corner tl"></span><span class="corner tr"></span>
        <span class="corner bl"></span><span class="corner br"></span>
        <div class="beam"></div>
        <img class="preview" id="preview" alt="" />
        <div class="scan-inner">
          <div class="scan-icon">
            <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="3"/><circle cx="9" cy="10" r="1.6"/><path d="M21 16l-5-5-8 8"/></svg>
          </div>
          <h2 class="scan-title">Drop an image to scan</h2>
          <p class="scan-sub">or <b>browse files</b> from your device</p>
          <p class="scan-formats">PNG · JPG · WEBP · up to 20 MB</p>
        </div>
        <input type="file" id="file" accept="image/*" />
      </label>

      <div class="actions">
        <button class="btn primary" id="startScan">
          <svg viewBox="0 0 24 24"><path d="M3 8V5a2 2 0 0 1 2-2h3M16 3h3a2 2 0 0 1 2 2v3M21 16v3a2 2 0 0 1-2 2h-3M8 21H5a2 2 0 0 1-2-2v-3"/></svg>
          Start scan
        </button>
        <button class="btn" id="useCamera">
          <svg viewBox="0 0 24 24"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>
          Use camera
        </button>
      </div>
      <p class="hint" id="hint">Upload a part image — NORMEX highlights what's good and what needs a closer look.</p>
    </section>

    <!-- Status -->
    <div class="status"><i></i> ENGINE READY</div>

    <!-- Theme toggle -->
    <div class="theme-toggle" role="group" aria-label="Theme">
      <span class="theme-label">THEME</span>
      <button class="active" data-theme="light" aria-label="Light mode" title="Light">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
      <button data-theme="dark" aria-label="Dark mode" title="Dark">
        <svg viewBox="0 0 24 24"><path d="M21 13A9 9 0 1 1 11 3a7 7 0 0 0 10 10z"/></svg>
      </button>
    </div>
  </main>

  <script type="module">
    // Show the scan interface after 5.5 seconds.
    setTimeout(() => {
      document.getElementById("welcome").hidden = true;
      document.getElementById("scanApp").hidden = false;
    }, 5500);

    const root = document.documentElement;

    // Theme toggle (remembers choice)
    const themeBtns = document.querySelectorAll(".theme-toggle button");
    const setTheme = (t) => {
      root.setAttribute("data-theme", t);
      themeBtns.forEach(b => b.classList.toggle("active", b.dataset.theme === t));
      document.querySelector('meta[name="theme-color"]').content = t === "dark" ? "#0d1a15" : "#f5f8f6";
      try { localStorage.setItem("normex-theme", t); } catch {}
    };
    themeBtns.forEach(b => b.addEventListener("click", () => setTheme(b.dataset.theme)));
    let saved = null;
    try { saved = localStorage.getItem("normex-theme"); } catch {}
    setTheme(saved || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"));

    // Top nav active state
    const navBtns = document.querySelectorAll(".nav button");
    navBtns.forEach(b => b.addEventListener("click", () => {
      navBtns.forEach(x => x.classList.remove("active"));
      b.classList.add("active");
    }));

    // Scanner: file pick + drag & drop preview
    const scanner = document.getElementById("scanner");
    const file = document.getElementById("file");
    const preview = document.getElementById("preview");
    const hint = document.getElementById("hint");

    const load = (f) => {
      if (!f || !f.type.startsWith("image/")) return;
      preview.src = URL.createObjectURL(f);
      scanner.classList.add("has-image");
      hint.textContent = `${f.name} loaded — press "Start scan" to inspect.`;
    };
    file.addEventListener("change", () => load(file.files[0]));
    ["dragenter", "dragover"].forEach(e => scanner.addEventListener(e, ev => { ev.preventDefault(); scanner.classList.add("drag"); }));
    ["dragleave", "drop"].forEach(e => scanner.addEventListener(e, ev => { ev.preventDefault(); scanner.classList.remove("drag"); }));
    scanner.addEventListener("drop", ev => load(ev.dataTransfer.files[0]));

    document.getElementById("startScan").addEventListener("click", () => {
      hint.textContent = scanner.classList.contains("has-image")
        ? "Scanning… analysing part for defects."
        : "Add an image first to start a scan.";
    });
    document.getElementById("useCamera").addEventListener("click", () => {
      file.setAttribute("capture", "environment");
      file.click();
    });
  </script>
</body>
</html>
